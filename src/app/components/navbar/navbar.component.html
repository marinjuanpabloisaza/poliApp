<div class="navbar bg-white shadow-sm px-6">
  <div class="flex-1">
    <a class="btn btn-ghost text-xl">
      <div class="flex items-center">
        <!-- Logo with gradient circle -->
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-blue-500 mr-2 flex items-center justify-center">
          <span class="text-white font-bold text-sm">C</span>
        </div>
        <span class="text-gray-800 font-semibold">Kairoz</span>
      </div>
    </a>
  </div>

  <div class="flex-none">
    <!-- Botón Volver al Catálogo (solo en página de servicio) -->
    <div *ngIf="isServicePage()" class="mr-4">
      <a routerLink="/dashboard" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-full hover:from-blue-700 hover:to-purple-700 transition-all flex items-center gap-2">
        ← Volver al Catálogo
      </a>
    </div>
    
    <!-- Navegación normal -->
    <ul class="menu menu-horizontal px-1 text-gray-800" *ngIf="!isServicePage()">
      <li><a class="hover:text-blue-600">Inicio</a></li>
      <li><a class="hover:text-blue-600">Servicios</a></li>
      <li><a class="hover:text-blue-600">Nosotros</a></li>
      <li><a class="hover:text-blue-600">Contacto</a></li>
      <!-- Botón de login -->
      <li *ngIf="!user()">
        <a routerLink="/login" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-lg hover:from-blue-700 hover:to-purple-700 transition-all">
          Login
        </a>
      </li>
    </ul>
    <!-- Usuario logueado -->
    <div class="dropdown dropdown-end" *ngIf="user() && !isServicePage()">
      <div tabindex="0" role="button" class="btn btn-ghost">
        <div class="w-25 rounded-full">
          {{ user()?.userName }}
        </div>
      </div>
      <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
        <li><span class="font-bold">Hola, {{ user()?.userName }}</span></li>
        <li><a (click)="authService.logout()">Logout</a></li>
      </ul>
    </div>
  </div>
</div>

<section>
  <router-outlet></router-outlet>
</section>
